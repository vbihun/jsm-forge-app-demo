modules:
  jiraServiceManagement:queuePage:
    - key: jsm-forge-app-demo-hello-world-queue-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: Training App Queue Page
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: ui/index.tsx
app:
  runtime:
    name: nodejs20.x
  id: ari:cloud:ecosystem::app/052fd576-9321-41d4-8f0c-713d83acd87c
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - read:servicedesk-request
